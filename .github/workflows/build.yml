#
# build.yml — build the release binary and the browser bundle. The test suites
# run in test.yml; the site publish is publish-site.yml (docs/CI.md).

name: Build DynamoDB Shell

on:
  release:
    types: [created]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  build-linux:
    # Builds the AWS SDK for C++ SHARED (and therefore OpenSSL shared) so the
    # job runs on current ubuntu-latest. A shared libcrypto.so records its own
    # DT_NEEDED entries for its provider dependencies (zstd, jitterentropy, …),
    # so the final link and the runtime loader resolve them transitively — no
    # library has to be named by hand to satisfy a static-libcrypto provider
    # dep. This replaces the earlier ubuntu-24.04 pin, which only worked because
    # 24.04's OpenSSL 3.0 static libcrypto.a happened to carry no such provider
    # objects. ddbsh-aws stays STATIC and links the one shared SDK .so, so there
    # is a single copy of the SDK's global state (no double-InitAPI hazard).
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install libcurl4-openssl-dev libssl-dev build-essential gcc g++ make cmake libreadline-dev flex bison

      - name: Install AWS SDK for C++
        run: |
          git clone --recurse-submodules https://github.com/aws/aws-sdk-cpp.git
          cd aws-sdk-cpp
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/usr/local/ -DCMAKE_INSTALL_PREFIX=/usr/local/ -DBUILD_ONLY="dynamodb;iam;sts" -DBUILD_SHARED_LIBS=ON -DENABLE_TESTING=OFF -DFORCE_SHARED_CRT=ON
          make && sudo make install
          # The SDK .so set is installed under /usr/local/lib; refresh the
          # loader cache so the produced ddbsh binary finds it at runtime.
          sudo ldconfig

      - name: Build binaries
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DDDBSH_BUILD_TESTS=OFF
          make

      - name: Verify the binary links and runs
        run: |
          # A missing-.so runtime failure must not hide behind a successful
          # link: actually run the binary (and confirm it is dynamically linked
          # against the shared libcrypto, not a static archive).
          ./build/ddbsh -c "quit"
          ldd ./build/ddbsh | grep -i crypto

      - name: Upload binaries as artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-linux
          path: |
                build/ddbsh

  # The browser edition (P9): built, packaged and checked offline by the
  # reusable web-bundle.yml, which the site publish (publish-site.yml) also
  # calls, so both build the bundle the same way. The live gates
  # (run-web-smoke, run-web-golden) need credentials and run outside CI.
  build-wasm:
    uses: ./.github/workflows/web-bundle.yml
    permissions:
      contents: read
