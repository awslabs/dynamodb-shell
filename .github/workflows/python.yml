#
# python.yml — build and test the Python packages (P13 T3(b), D-P13-8).
#
# Every pull request, every push to main, manual runs, and pypi.yml (which
# calls this workflow and publishes what it builds):
#   sdist    the ddbsh source distribution, then a wheel built from it, so a
#            missing source file fails here and not on a user's machine.
#   wheels   cibuildwheel (configuration in pyproject.toml): CPython 3.9 to
#            3.13 on Linux x86_64 and aarch64 (manylinux_2_28), macOS arm64
#            and x86_64, and Windows AMD64. Each wheel runs the offline
#            pytest suite (python/tests).
#   alias    the libddbsh alias (python/alias, D-P13-4), installed with the
#            Linux x86_64 ddbsh wheel and tested.
# No job uses AWS: the live Python tests run in test.yml's real-dynamodb job.
# docs/CI.md describes the workflows.

name: Python

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions: {}

defaults:
  run:
    shell: bash

env:
  AWS_EC2_METADATA_DISABLED: "true"
  CMAKE_BUILD_PARALLEL_LEVEL: "4"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  sdist:
    name: Python sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install flex and bison
        run: |
          sudo apt-get -y update
          sudo apt-get -y install flex bison

      - name: Build the sdist
        run: |
          python -m pip install build
          python -m build --sdist --outdir dist .
          ls -l dist

      # Outside the checkout, so nothing but the sdist's own files is used.
      - name: Build a wheel from the sdist and test it
        run: |
          work="$(mktemp -d)"
          python -m venv "$work/venv"
          "$work/venv/bin/python" -m pip install --quiet "$(ls dist/ddbsh-*.tar.gz)" pytest
          cd "$work"
          "$work/venv/bin/python" -c '
          import ddbsh
          with ddbsh.connect_memory() as c:
              c.run("create table t ( id number ) primary key ( id hash );")
              c.run("insert into t ( id ) values ( 1 );")
              out = c.run("select * from t;")
          assert out == "{id: 1}\n", out
          print("ddbsh", ddbsh.__version__, "from the sdist: ok")
          '

      - name: Upload the sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-sdist
          path: dist/ddbsh-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  wheels:
    name: Python wheels (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: macos-arm64
            runner: macos-15
          - name: macos-x86_64
            runner: macos-15-intel
          - name: windows-amd64
            runner: windows-latest

    steps:
      # Windows runners check out text files with CRLF line ends by default;
      # keep the tree byte-identical to the other platforms (the grammar, the
      # scanner and the golden files the tests compare against).
      - name: Check out with LF line ends
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A step limit well under the job's 120 minutes (P14, B8; D-P14-5), so
      # a stalled runner (main's run 45674041047: macos-x86_64 hung on a
      # python.org download until the job limit) fails in 40 minutes. The
      # slowest healthy run of this step took 20 minutes (macos-x86_64, run
      # 45667718977); 40 is twice that.
      - name: Build and test the wheels
        timeout-minutes: 40
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        with:
          output-dir: wheelhouse

      - name: Upload the wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-wheels-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  alias:
    name: Python alias (libddbsh)
    needs: wheels
    # The Linux x86_64 wheels are enough to test the alias; a failure on
    # another platform is reported by its own job.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Download the Linux x86_64 wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-wheels-linux-x86_64
          path: wheelhouse

      - name: Build the alias
        run: |
          python -m pip install build
          python -m build --outdir dist python/alias
          ls -l dist

      - name: Install ddbsh and the alias, and test the alias
        run: |
          work="$(mktemp -d)"
          python -m venv "$work/venv"
          "$work/venv/bin/python" -m pip install --quiet \
            "$(ls wheelhouse/ddbsh-*-cp312-*.whl)" "$(ls dist/libddbsh-*.whl)" pytest
          cd "$work"
          "$work/venv/bin/python" -m pytest -p no:cacheprovider -q \
            "$GITHUB_WORKSPACE/python/tests/test_alias.py"

      - name: Upload the alias
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-alias
          path: dist/libddbsh-*
          if-no-files-found: error
          retention-days: 14
